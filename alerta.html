<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#1A56A0"/>
<title>Alerta</title>
<style>
:root{--bg:#F4F1EA;--card:#FFFaf4;--p:#1A56A0;--g:#2F6B45;--r:#B42318;--ink:#1C1917;--m:#57534E}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#111827;color:var(--ink)}
.app{max-width:430px;margin:0 auto;min-height:100dvh;background:var(--bg);position:relative}
.cover{position:fixed;inset:0;max-width:430px;margin:auto;z-index:50;background:#0F172A;display:flex;flex-direction:column;justify-content:flex-end}
.cover .ph{position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,23,42,.2),rgba(15,23,42,.88)),#1E3A5F}
.cover .in{position:relative;padding:24px 20px calc(24px + env(safe-area-inset-bottom))}
.cover small{letter-spacing:.2em;color:#E2E8F0;font-size:.7rem}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:16px;font-size:1.02rem;font-weight:700;margin-top:10px;cursor:pointer}
.blue{background:var(--p);color:#fff}.green{background:var(--g);color:#fff}.red{background:var(--r);color:#fff}
.ghost{background:transparent;border:0;color:var(--p);text-decoration:underline;padding:10px;width:100%;font-size:.95rem}
header{padding:16px 16px 6px}header h1{margin:0;font-size:1.5rem}header p{margin:6px 0 0;color:var(--m);line-height:1.4}
main{padding:8px 16px 108px}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 6px 18px rgba(0,0,0,.05)}
.card h2{margin:0 0 8px;font-size:1.08rem}
.muted{color:var(--m);line-height:1.5;font-size:.95rem}
.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:430px;background:#fff;border-top:1px solid #E7E5E4;display:grid;grid-template-columns:repeat(5,1fr);padding:8px 2px calc(8px + env(safe-area-inset-bottom));z-index:20}
.nav button{background:0;border:0;color:#78716C;font-size:.68rem;font-weight:600}
.nav button.on{color:var(--p)}
.opt{border:2px solid #E7E5E4;border-radius:14px;padding:12px;margin:8px 0;background:#fff}
.opt.on{border-color:var(--p);background:#EFF6FF}
a.btn{text-align:center;text-decoration:none}
.hide{display:none!important}
.step{display:flex;gap:10px;margin:10px 0}
.num{width:28px;height:28px;border-radius:50%;background:var(--p);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:.85rem}
</style>
</head>
<body>
<div class="app">
<div class="cover" id="cover">
  <div class="ph"></div>
  <div class="in">
    <small>ALERTA</small>
    <p style="color:#fff;font-size:1.4rem;margin:8px 0 0;line-height:1.25">Qué hacer hoy<br/>por tu hijo.</p>
    <button class="btn blue" onclick="entrar()">Entrar</button>
  </div>
</div>
<header><h1 id="t">Hoy</h1><p id="s">Tres cosas. Esta noche.</p></header>
<main id="v"></main>
<nav class="nav">
  <button class="on" id="n-hoy" onclick="go('hoy')">Hoy</button>
  <button id="n-pasos" onclick="go('pasos')">3 pasos</button>
  <button id="n-temas" onclick="go('temas')">Temas</button>
  <button id="n-mas" onclick="go('mas')">Más</button>
  <button id="n-crisis" onclick="go('crisis')">Crisis</button>
</nav>
</div>
<script>
var ALMA='https://usalma.app/';
var T={
  comunicacion:{n:'Comunicación',free:1},
  ansiedad:{n:'Ansiedad'},
  depresion:{n:'Depresión'},
  bullying:{n:'Bullying'},
  ciber:{n:'Ciberbullying'},
  adicciones:{n:'Adicciones'},
  acoso:{n:'Acoso'},
  conducta:{n:'Comportamiento'},
  codep:{n:'Cuidar de ti',free:1}
};
var C={
  comunicacion:{
    para:'Reabrir el canal cuando solo hay silencio.',
    sen:'“No sé”. Se encierra. Evita la mesa. Solo temas vacíos.',
    hoy:['10 minutos sin pantallas y sin corregir.','Una pregunta abierta.','Si no habla, deja la puerta abierta.'],
    decir:'“Cuando quieras, estoy disponible sin juzgar.”',
    no:'Interrogatorio. Sermón. “Siempre igual.”',
    prev:'Hablar un poco cuando todo está bien, no solo cuando explota.',
    flag:'Si el silencio viene con “nada tiene sentido” o daño, ve a Crisis.'
  },
  ansiedad:{
    para:'Cuando la preocupación no baja con lógica.',
    sen:'No se calma. Dolor de panza o cabeza. Evita escuela o hablar. Revisa si alguien se enojó. No duerme. Se irrita por poco.',
    hoy:['10 min sin celular: “¿cómo te sientes de verdad?”','Valida. No discutas el miedo.','Quita UNA fuente (noticias, un examen, una red).'],
    decir:'“He notado que cargas mucha preocupación. Estoy de tu lado.”',
    no:'“Cálmate.” “No es para tanto.” Obligar a hablar en el pico. Celular como única calma.',
    prev:'Sueño. Límite de redes de noche. Nombrar emociones en días buenos.',
    flag:'Pánico repetido, rechazo total a la escuela, no come o no sale → profesional esta semana.'
  },
  depresion:{
    para:'Ver un apagón y acercar ayuda. No “ponerlo positivo”.',
    sen:'Dejó de disfrutar. Duerme de más o de menos. Se aisla. “Nada tiene sentido.” Cansancio. Bajan calificaciones.',
    hoy:['Contacto diario sin pedirle ánimo.','10 minutos juntos.','Si hay desesperanza, pregunta por daño y agenda ayuda esta semana.'],
    decir:'“Te veo más apagado y me importa. No estás solo. Podemos buscar ayuda.”',
    no:'“Ponte positivo.” “Es una etapa.” Dejarlo solo muchas horas si hay ideas de daño.',
    prev:'Rutina chica. Luz de día. Un adulto estable.',
    flag:'Ideas de morir, plan, autolesión, no come ni duerme → Crisis ya.'
  },
  bullying:{
    para:'Distinguir pelea de acoso que se repite.',
    sen:'No quiere ir. Moretones o cosas “perdidas”. Cambia después de clases. Evita compañeros. Pide dinero. Se culpa.',
    hoy:['Escucha sin interrumpir.','Anota fechas, nombres, hechos.','Habla con un adulto de la escuela. “Esto no es tu culpa.”'],
    decir:'“Esto no es tu culpa. Vamos a pedirle a la escuela que actúe con hechos.”',
    no:'“Ignóralos.” “Pégale.” Confrontar agresores o padres por tu cuenta.',
    prev:'Un adulto de confianza en el colegio. Revisar el camino a casa.',
    flag:'Amenazas graves, violencia repetida, ideas de daño por el acoso → dirección y si aplica autoridades.'
  },
  ciber:{
    para:'Acoso en el teléfono. Documentar sin castigar primero.',
    sen:'Miedo al celular. Borra cuentas. Esconde el teléfono. No puede dejar de revisar. “Me están exponiendo.”',
    hoy:['Revisen juntos, en calma.','Capturas. Reportar y bloquear.','Si hay escuela, informar con evidencia.'],
    decir:'“No respondas ahora. Enséñame la pantalla. Lo vemos juntos.”',
    no:'Quitar el celular como primer castigo. Responder tú a los agresores. “Es solo internet.”',
    prev:'Cuentas con privacidad. No compartir fotos íntimas. Un adulto sabe la clave de emergencia.',
    flag:'Amenazas o imágenes íntimas: documentar y denunciar según el país. No confrontar solo.'
  },
  adicciones:{
    para:'Sustancias o pantallas/juego que ya mandan. Es tratable. No es “vicio”.',
    sen:'Cambia de amigos. Olores, ojos, peso. Mentiras de dónde estuvo. Falta dinero o pastillas. Pierde escuela. Se pone agresivo si no consume. Horas de juego con pelea si se corta.',
    hoy:['10 min desde la preocupación. No uses la palabra adicto.','Anota 3 días. Reduce el acceso fácil.','Agenda una evaluación. No esperes “tocar fondo”.'],
    decir:'“Te quiero. El alcohol y las drogas pueden generar una enfermedad tratable. Vamos a buscar ayuda. No te abandono.”',
    no:'Humillar. “Es normal de la edad.” Esperar fondo. Interrogatorio 24/7. Quitar el celular como único tratamiento.',
    prev:'Hablar antes de que pase. Casa sin “es solo una cerveza de adultos sin límite”.',
    flag:'Intoxicación, desmayo, agresividad con consumo, opioides o inhalantes → urgencias.'
  },
  acoso:{
    para:'Proteger y creer. No hacer de detective.',
    sen:'Miedo a una persona o lugar. Cambia higiene o ropa. Regresa a conductas de niño. Evita a alguien. Quejas físicas sin causa clara.',
    hoy:['Espacio seguro. “Te creo.”','Corta el contacto con la persona señalada.','Si la sospecha es fundada, rutas oficiales el mismo día.'],
    decir:'“Te creo. No fue tu culpa. Voy a protegerte.”',
    no:'Interrogatorio policial. Pedir pruebas al niño. Confrontar al agresor solo. “Seguro malinterpretaste.”',
    prev:'Partes privadas. Derecho a decir no. Un secreto de un adulto que da miedo no se guarda en casa.',
    flag:'Revelación o sospecha fundada de abuso sexual → proteger + autoridades. No confrontar al posible agresor.'
  },
  conducta:{
    para:'Un límite cuando hay explosión, sin gritar desde la rabia.',
    sen:'Ira desproporcionada. Desafía. Agrede o rompe. Mentiras. Busca riesgo. Parece no importarle la consecuencia.',
    hoy:['UNA regla esta semana.','Una consecuencia que sí puedas cumplir.','Revisa sueño, hambre, pantallas y escuela.'],
    decir:'“Lo que hiciste no está bien. Tú sí me importas.”',
    no:'Gritar. Apilar castigos. Comparar hermanos. Ignorar esperando que se le quite.',
    prev:'Elogiar lo que sí hace. Regularte tú primero.',
    flag:'Violencia grave, fuga, riesgo a sí o a otros → seguridad + profesional.'
  },
  codep:{
    para:'Que tú no te apagues. Cuidar no es controlar.',
    sen:'No duermes de vigilar. Dejas salud o trabajo. Mientes “para proteger”. Pagas siempre las consecuencias. “Solo yo lo arreglo.”',
    hoy:['Un límite escrito.','Deja de cubrir una mentira.','5–10 minutos para ti.'],
    decir:'“Te quiero. No voy a mentir ni a financiar esto. Si quieres ayuda, te acompaño.”',
    no:'Salvarlo a costa de ti. Eso sostiene el problema.',
    prev:'Las 3 C: no lo causaste, no lo controlas, no lo curas tú solo.',
    flag:'Si tú no puedes más, Crisis y un grupo o profesional para ti.'
  }
};
function st(){try{return JSON.parse(localStorage.getItem('alerta2')||'{}')}catch(e){return {}}}
function sv(d){localStorage.setItem('alerta2',JSON.stringify(d))}
function entrar(){
  document.getElementById('cover').classList.add('hide');
  var d=st();
  if(!d.edad) onb();
  else go('hoy');
}
function onb(){
  document.getElementById('t').textContent='Tu hijo';
  document.getElementById('s').textContent='Dos pasos. Luego, qué hacer hoy.';
  var h='<div class="card"><h2>¿Qué edad tiene?</h2>';
  [['6-11','6 a 11'],['12-15','12 a 15'],['15-18','15 a 18'],['18+','18 o más']].forEach(function(x){
    h+='<div class="opt" onclick="edad(\''+x[0]+'\')">'+x[1]+'</div>';
  });
  document.getElementById('v').innerHTML=h;
}
function edad(e){
  var d=st(); d.edad=e; d.temas=d.temas||['comunicacion']; sv(d);
  var h='<div class="card"><h2>¿Qué te preocupa ahora?</h2><p class="muted">Puedes marcar más de uno.</p>';
  Object.keys(T).forEach(function(k){
    var on=(d.temas||[]).indexOf(k)>=0;
    h+='<div class="opt '+(on?'on':'')+'" onclick="tog(\''+k+'\')">'+T[k].n+'</div>';
  });
  h+='<button class="btn blue" onclick="go(\'hoy\')">Ver mis 3 de hoy</button></div>';
  document.getElementById('v').innerHTML=h;
}
function tog(k){
  var d=st(); d.temas=d.temas||[];
  var i=d.temas.indexOf(k);
  if(i>=0) d.temas.splice(i,1); else d.temas.push(k);
  if(!d.temas.length) d.temas=['comunicacion'];
  sv(d); edad(d.edad);
}
function go(tab){
  ['hoy','pasos','temas','mas','crisis'].forEach(function(k){
    document.getElementById('n-'+k).className=k===tab?'on':'';
  });
  if(tab==='hoy')hoy();
  if(tab==='pasos')pasos();
  if(tab==='temas')temas();
  if(tab==='mas')mas();
  if(tab==='crisis')crisis();
}
function tres(){
  var d=st(); var temas=d.temas&&d.temas.length?d.temas:['comunicacion'];
  var out=[];
  temas.forEach(function(k){ if(C[k]) out=out.concat(C[k].hoy); });
  var uniq=[];
  out.forEach(function(x){ if(uniq.indexOf(x)<0) uniq.push(x); });
  return uniq.slice(0,3);
}
function hoy(){
  document.getElementById('t').textContent='Hoy';
  document.getElementById('s').textContent='Qué hacer esta noche. No un curso.';
  var steps=tres();
  var h='<div class="card"><h2>Tus 3 de hoy</h2>';
  steps.forEach(function(s,i){h+='<div class="step"><div class="num">'+(i+1)+'</div><div class="muted">'+s+'</div></div>';});
  h+='<button class="btn blue" onclick="go(\'pasos\')">Ver mis 3 pasos de hoy</button></div>';
  h+='<button class="btn red" onclick="go(\'crisis\')">Necesito ayuda ya</button>';
  h+='<a class="btn green" href="'+ALMA+'">Consejo de un profesional</a>';
  h+='<div class="card"><p class="muted">Cómo usar Alerta: una cosa a la vez. Si hay peligro, Crisis. El profesional es Alma.</p>'+
    '<button class="ghost" onclick="tut(0)">Cómo usar Alerta (2 min)</button></div>';
  document.getElementById('v').innerHTML=h;
}
function pasos(){
  document.getElementById('t').textContent='3 pasos';
  document.getElementById('s').textContent='Máximo tres. Si hay varias crisis, estos primero.';
  var h='<div class="card">';
  tres().forEach(function(s,i){h+='<div class="step"><div class="num">'+(i+1)+'</div><div>'+s+'</div></div>';});
  h+='</div><p class="muted">No es un manual infinito. Si no puedes más, Crisis.</p>';
  document.getElementById('v').innerHTML=h;
}
function temas(){
  document.getElementById('t').textContent='Temas';
  document.getElementById('s').textContent='Casa. Escuela. Riesgo. Tú.';
  var grupos=[
    ['En casa',['comunicacion','conducta']],
    ['En la escuela y en el celular',['bullying','ciber','acoso']],
    ['Por dentro',['ansiedad','depresion','adicciones']],
    ['Tú',['codep']]
  ];
  var h='';
  grupos.forEach(function(g){
    h+='<p class="muted" style="margin:16px 4px 8px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;font-size:.75rem">'+g[0]+'</p>';
    g[1].forEach(function(k){
      h+='<div class="card" onclick="ver(\''+k+'\')"><h2>'+T[k].n+'</h2><p class="muted">'+(C[k].para)+'</p></div>';
    });
  });
  document.getElementById('v').innerHTML=h;
}
function ver(k){
  var x=C[k];
  document.getElementById('t').textContent=T[k].n;
  document.getElementById('s').textContent='Señales. Hoy. Qué decir. Qué no.';
  var d=st();
  if((d.temas||[]).indexOf(k)<0){ d.temas=(d.temas||[]).concat([k]); sv(d); }
  document.getElementById('v').innerHTML=
    '<div class="card"><h2>Señales</h2><p class="muted">'+x.sen+'</p></div>'+
    '<div class="card"><h2>Qué hacer hoy</h2><p class="muted">'+x.hoy.join(' ')+'</p></div>'+
    '<div class="card"><h2>Qué decir</h2><p class="muted">'+x.decir+'</p></div>'+
    '<div class="card"><h2>Qué no hacer</h2><p class="muted">'+x.no+'</p></div>'+
    '<div class="card"><h2>Prevención</h2><p class="muted">'+x.prev+'</p></div>'+
    '<div class="card"><h2>Banderas rojas</h2><p class="muted">'+x.flag+'</p>'+
    '<button class="btn red" onclick="go(\'crisis\')">Crisis</button>'+
    '<a class="btn green" href="'+ALMA+'">Consejo de un profesional</a></div>'+
    '<button class="ghost" onclick="go(\'temas\')">Volver a temas</button>';
}
function tut(n){
  var a=[
    ['Una sola cosa','No leas todo. Elige Hoy o un tema.'],
    ['Botón grande','3 pasos = qué hacer esta noche.'],
    ['Peligro','Crisis está siempre abajo. Nunca se cobra.'],
    ['Temas','Tú los enciendes. No es un diagnóstico.'],
    ['Cuidar de ti','Si todo gira alrededor del problema, abre Cuidar de ti.'],
    ['Cada noche','Abre Hoy. Tres pasos. Luego cierra el teléfono.']
  ][n];
  document.getElementById('t').textContent='Cómo usar Alerta';
  document.getElementById('s').textContent=(n+1)+' de 6';
  document.getElementById('v').innerHTML='<div class="card"><h2>'+a[0]+'</h2><p class="muted">'+a[1]+'</p>'+
    (n<5?'<button class="btn blue" onclick="tut('+(n+1)+')">Siguiente</button>':'<button class="btn blue" onclick="go(\'hoy\')">Empezar</button>')+
    '<button class="ghost" onclick="go(\'hoy\')">Saltar</button></div>';
}
function crisis(){
  document.getElementById('t').textContent='Crisis';
  document.getElementById('s').textContent='Gratis. Siempre.';
  document.getElementById('v').innerHTML=
    '<div class="card"><h2>1. No lo dejes solo</h2><p class="muted">Quédate. Quita medios de daño si puedes sin pelear.</p></div>'+
    '<div class="card"><h2>2. Llama</h2>'+
    '<a class="btn red" href="tel:911">911</a>'+
    '<a class="btn red" href="tel:988">988 EE.UU. / Canadá</a>'+
    '<p class="muted" style="margin-top:10px">México: emergencias locales o 800 911 2000 según tu estado. Colombia 123. Argentina 135. Chile 600 360 7777. España 024.</p></div>'+
    '<div class="card"><h2>3. Después</h2><p class="muted">Un profesional. Alma no es urgencias.</p>'+
    '<a class="btn green" href="'+ALMA+'">Consejo de un profesional</a></div>'+
    '<p class="muted">Esto no es un dispositivo médico. En peligro real, el teléfono de emergencias de tu país.</p>';
}
function mas(){
  document.getElementById('t').textContent='Más';
  document.getElementById('s').textContent='Mapa. Sin menús escondidos.';
  document.getElementById('v').innerHTML=
    '<div class="card" onclick="tut(0)"><h2>Cómo usar Alerta</h2><p class="muted">Dos minutos.</p></div>'+
    '<div class="card" onclick="ver(\'codep\')"><h2>Cuidar de ti</h2><p class="muted">Cuando todo gira alrededor del problema.</p></div>'+
    '<div class="card" onclick="go(\'temas\')"><h2>Temas</h2></div>'+
    '<div class="card" onclick="go(\'crisis\')"><h2>Crisis</h2></div>'+
    '<div class="card"><h2>Escuela</h2><p class="muted">La falta y el aviso viven en Presencia / Enseñanza Digna. Aquí es qué hacer en casa.</p></div>'+
    '<a class="btn green" href="'+ALMA+'">Consejo de un profesional</a>'+
    '<button class="ghost" onclick="onb()">Cambiar edad o temas</button>'+
    '<p class="muted">Plus (videos, laboratorio, exportar) se arma cuando un colegio pague. Crisis no se cobra nunca.</p>';
}
if(st().edad){document.getElementById('cover').classList.add('hide');go('hoy');}
</script>
</body>
</html>
