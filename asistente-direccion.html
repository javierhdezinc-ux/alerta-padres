<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Asistente de Dirección — Enseñanza Digna</title>
<style>
:root{--n:#0b1f3a;--o:#c9a227;--ok:#2d6a4f;--bg:#f4efe4}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#1a1a1a}
header{background:var(--n);color:#fff;padding:16px}
h1{margin:0;font-size:18px}
header p{margin:6px 0 0;font-size:13px;opacity:.9}
.wrap{max-width:560px;margin:0 auto;padding:14px}
.card{background:#fff;border-radius:16px;padding:14px;margin:0 0 12px;box-shadow:0 8px 20px #0001}
button,.chip{border:0;border-radius:14px;padding:13px;font-size:15px;font-weight:700;width:100%;margin:6px 0;text-align:left}
.chip{background:#eef2f7;color:var(--n)}
.chip.on{background:var(--n);color:#fff}
.btn{background:var(--n);color:#fff;text-align:center}
.gold{background:var(--o);color:#1a1a1a;text-align:center}
.line{background:#fff;border:2px solid var(--n);color:var(--n);text-align:center}
textarea,select{width:100%;padding:12px;border:1px solid #d7ccb4;border-radius:12px;font-size:16px;margin:8px 0}
.muted{color:#666;font-size:13px;line-height:1.45}
pre{white-space:pre-wrap;font-family:Georgia,serif;font-size:15px;line-height:1.45;background:#faf7f0;padding:12px;border-radius:12px}
.rol{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rol button{margin:0;text-align:center;min-height:64px}
</style>
</head>
<body>
<header>
  <h1>Asistente de Dirección</h1>
  <p>Director, subdirector y secretaría. Borrador listo para copiar. Usted firma.</p>
</header>
<div class="wrap" id="app"></div>
<script>
const ROLES={
  dir:{
    nom:"Director / Directora",
    intro:"Usted responde por el plantel entero (300–1000 alumnos): pedagógico, administrativo, convivencia y la cara ante padres y autoridad.",
    botones:[
      ["circular","Circular a padres o staff"],
      ["cte","Guion y acta de Consejo Técnico"],
      ["junta_padres","Convocatoria de junta de padres"],
      ["conflicto","Guion para un conflicto (alumno, maestro o padre)"],
      ["reconocer","Nota de reconocimiento a un maestro"],
      ["supervision","Lista de lo que pide una supervisión"],
      ["inicio_ciclo","Checklist de inicio de ciclo"],
      ["cierre_ciclo","Checklist de cierre de ciclo"],
      ["discurso","Palabras de 3 minutos (ceremonia / honores)"],
      ["correo_autoridad","Oficio o correo a supervisión / control escolar"]
    ]
  },
  subac:{
    nom:"Subdirector académico",
    intro:"Usted cubre clases, CTE pedagógico, acompañamiento docente y que el plan de estudios se cumpla.",
    botones:[
      ["cobertura","Cubrir una falta de maestro (hoy)"],
      ["observacion","Guion de visita a clase (10 min)"],
      ["cte_acad","Orden del día académico del CTE"],
      ["remedial","Plan de regularización de un grupo"],
      ["nuevo_docente","Inducción de 1 página para maestro nuevo"],
      ["calendario_eval","Calendario de evaluaciones del periodo"]
    ]
  },
  subad:{
    nom:"Subdirector administrativo",
    intro:"Usted cubre plantilla, edificio, proveedores, caja chica y que el colegio abra mañana.",
    botones:[
      ["plantilla","Nota de cobertura de personal (intendencia, portería, docente)"],
      ["mantenimiento","Orden de trabajo a mantenimiento"],
      ["proveedor","Recado a un proveedor"],
      ["simulacro","Guion de simulacro / salida segura"],
      ["inventario","Lista corta de inventario del mes"],
      ["suple_dir","Qué hacer si el director no está hoy"]
    ]
  },
  secdir:{
    nom:"Secretaría de dirección",
    intro:"Usted agenda, filtra, arma oficios y no deja que el director pierda la mañana en ventanilla.",
    botones:[
      ["agenda","Agenda del director (mañana / semana)"],
      ["oficio","Oficio o constancia (plantilla)"],
      ["cita_padre","Cita con un padre: confirmación"],
      ["filtro","Cómo responder a un padre que llegó sin cita"],
      ["minuta","Minuta de 1 página de una reunión"],
      ["recordatorio","Recordatorio a un maestro que no entregó"]
    ]
  },
  secesc:{
    nom:"Secretaría de control escolar",
    intro:"Usted vive de padrones, bajas, boletas y que el archivo coincida con lo que pide la autoridad. El asistente NO fabrica boletas oficiales SEP.",
    botones:[
      ["alta","Checklist de alta / inscripción"],
      ["baja","Checklist de baja"],
      ["constancia","Constancia de estudios (borrador)"],
      ["lista_docs","Documentos que faltan en un expediente"],
      ["circular_fechas","Circular de fechas de boletas / cierre"],
      ["pedido_maestro","Recado a maestros: calificaciones en fecha"]
    ]
  }
};

const SYS=`Eres asistente de un colegio particular en México (300 a 1000 alumnos).
Escribes en español claro, listo para copiar a circular, oficio o WhatsApp interno.
No inventes folios SEP, RVOE, CCT ni calificaciones oficiales.
No diagnostiques alumnos. No sustituyas al abogado ni al psicólogo.
Si el tema es grave (abuso, violencia), indica derivar a protocolo y autoridad.
Cierra con: "Borrador. Dirección revisa y firma."`;

const DETALLE={
  circular:"Redacta una circular corta (máx 180 palabras) con: para quién, qué, cuándo, qué deben hacer. Tono firme y respetuoso.",
  cte:"Arma: 1) objetivo de 1 línea 2) orden del día de 5 puntos 3) plantilla de acta (asistentes, acuerdos, responsables, fecha de seguimiento).",
  junta_padres:"Convocatoria: motivo, fecha, hora, lugar, duración, si hay que firmar algo. 120 palabras.",
  conflicto:"Guion de reunión de 15 min: abrir, escuchar, hecho observable, acuerdo, quién da seguimiento. Sin humillar.",
  reconocer:"Nota de 80 palabras a un docente. Específica. Sin adular.",
  supervision:"Lista de 12 cosas que una supervisión suele pedir (expedientes, CTE, bitácora, protección civil, control escolar). Casillas.",
  inicio_ciclo:"Checklist de 15 puntos: padrones, horarios, protección civil, bienvenida padres, agentes, canal oficial.",
  cierre_ciclo:"Checklist de 12 puntos: boletas, archivos, inventario, cartas de reinscripción, actas.",
  discurso:"Texto hablado de 3 minutos. Sencillo. Sin frases vacías.",
  correo_autoridad:"Oficio de 3 párrafos: asunto, hechos, petición. Espacios para CCT y sello. No inventes números.",
  cobertura:"Plan de hoy: quién cubre, qué grupo, qué deja el titular, recado a padres si aplica.",
  observacion:"Guion de visita a aula de 10 min: qué mirar, 3 preguntas al maestro, nota de devolución.",
  cte_acad:"Orden del día académico: aprendizajes, rezago, acuerdos por grado.",
  remedial:"Plan de 2 semanas para un grupo atrasado. Realista.",
  nuevo_docente:"Inducción de 1 página: horario, canal Equipo, cómo se manda una falta, a quién escalar.",
  calendario_eval:"Calendario tipo del periodo (semanas) con entregas internas. Fechas genéricas editables.",
  plantilla:"Nota interna: puesto cubierto, horario, quién autorizó.",
  mantenimiento:"Orden: lugar, falla, urgencia (hoy / esta semana), quién reporta.",
  proveedor:"Recado de 6 líneas a proveedor. Qué, cuándo, quién recibe.",
  simulacro:"Guion de 1 página: roles (portería, docentes, dirección), puntos de reunión, qué no hacer.",
  inventario:"Lista de 10 rubros (limpieza, botiquín, extintores, llaves, radios).",
  suple_dir:"Protocolo de 8 puntos si el director falta hoy.",
  agenda:"Agenda tipo de un día de director en colegio de 500 alumnos, con huecos de 15 min.",
  oficio:"Plantilla de oficio: membrete, asunto, cuerpo, copia. Sin folio inventado.",
  cita_padre:"Mensaje de confirmación de cita: día, hora, con quién, de qué, 15 min.",
  filtro:"Guion de 6 líneas para secretaría cuando llega un padre sin cita.",
  minuta:"Minuta: tema, asistentes, 3 acuerdos, responsables, fecha.",
  recordatorio:"Recado breve a un maestro que no entregó un documento. Firme, no grosero.",
  alta:"Checklist de inscripción: acta, CURP, cartilla, fotos, tutor, consentimiento de datos, correo para avisos.",
  baja:"Checklist de baja: motivo, documentos que se entregan, qué se archiva, aviso a maestros.",
  constancia:"Borrador de constancia de estudios CON huecos (nombre, grado, ciclo). Sin sello digital SEP.",
  lista_docs:"Lista de documentos típicos que faltan en un expediente de básica.",
  circular_fechas:"Circular a docentes: fecha tope de captura, quién concentra, qué no se acepta tarde.",
  pedido_maestro:"Recado de 5 líneas a docentes sobre calificaciones o listas."
};

let estado={rol:"dir",bot:"circular"};

function home(){
  document.getElementById("app").innerHTML=`
  <div class="card">
    <h2>¿Quién pide ayuda?</h2>
    <div class="rol">
      <button class="chip" onclick="setRol('dir')">Director</button>
      <button class="chip" onclick="setRol('subac')">Sub. académico</button>
      <button class="chip" onclick="setRol('subad')">Sub. administrativo</button>
      <button class="chip" onclick="setRol('secdir')">Sec. dirección</button>
      <button class="chip" onclick="setRol('secesc')">Control escolar</button>
    </div>
    <p class="muted">Mismo estilo que el agente del maestro: un toque, un borrador. No sustituye la firma ni el sistema SEP.</p>
  </div>`;
}

function setRol(r){
  estado.rol=r;
  const R=ROLES[r];
  let b=R.botones.map(([id,n])=>`<button class="chip${id===estado.bot?' on':''}" onclick="estado.bot='${id}';setRol('${r}')">${n}</button>`).join("");
  document.getElementById("app").innerHTML=`
  <div class="card">
    <button class="line" onclick="home()">← Cambiar puesto</button>
    <h2>${R.nom}</h2>
    <p class="muted">${R.intro}</p>
    ${b}
    <textarea id="extra" rows="3" placeholder="Datos de ESTA escuela (nombres, fechas, grupo). Si no pone nada, sale plantilla."></textarea>
    <button class="btn" onclick="generar()">Preparar borrador</button>
  </div>
  <div id="out"></div>`;
}

function plantillaLocal(bot, extra){
  const R=ROLES[estado.rol];
  const pedido=DETALLE[bot]||bot;
  const extras=extra?`\nDatos que dio el colegio:\n${extra}\n`:"";
  return `${R.nom} · ${pedido}
${extras}
BORRADOR (edite nombres y fechas)

1. Encabezado: Colegio ________ · Ciclo 2026-2027
2. Asunto: (completar)
3. Cuerpo en 3 párrafos cortos.
4. Qué debe hacer el lector y para cuándo.
5. Quién firma.

No invente CCT, RVOE ni calificaciones.
Si hay menor en riesgo: protocolo escolar + autoridad, no este texto.

Borrador. Dirección revisa y firma.`;
}

function generar(){
  const extra=(document.getElementById("extra")||{}).value||"";
  const texto=plantillaLocal(estado.bot, extra);
  document.getElementById("out").innerHTML=`
  <div class="card">
    <p class="muted">Sin servidor de IA esto es plantilla. Si más tarde encienden el router, el mismo botón pide el texto fino.</p>
    <pre id="txt">${texto.replace(/</g,"")}</pre>
    <button class="gold" onclick="navigator.clipboard.writeText(document.getElementById('txt').innerText);alert('Copiado')">Copiar</button>
  </div>`;
}

home();
</script>
</body>
</html>
