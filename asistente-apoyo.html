<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Papeleo · Psicólogo y TS — Enseñanza Digna</title>
<style>
:root{--n:#0b1f3a;--o:#c9a227;--bg:#f4efe4}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#1a1a1a}
header{background:var(--n);color:#fff;padding:16px}
h1{margin:0;font-size:18px}
header p{margin:6px 0 0;font-size:13px;opacity:.9}
.wrap{max-width:560px;margin:0 auto;padding:14px}
.card{background:#fff;border-radius:16px;padding:14px;margin:0 0 12px;box-shadow:0 8px 20px #0001}
button,.chip{border:0;border-radius:14px;padding:13px;font-size:15px;font-weight:700;width:100%;margin:6px 0;text-align:left}
.chip{background:#eef2f7;color:var(--n)}
.btn{background:var(--n);color:#fff;text-align:center}
.gold{background:var(--o);color:#1a1a1a;text-align:center}
.line{background:#fff;border:2px solid var(--n);color:var(--n);text-align:center}
textarea{width:100%;padding:12px;border:1px solid #d7ccb4;border-radius:12px;font-size:16px;margin:8px 0}
.muted{color:#666;font-size:13px;line-height:1.45}
pre{white-space:pre-wrap;font-family:Georgia,serif;font-size:15px;line-height:1.45;background:#faf7f0;padding:12px;border-radius:12px}
.warn{background:#fdecea;color:#7a1f1f;padding:10px 12px;border-radius:12px;font-size:13px}
.rol{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rol button{margin:0;text-align:center;min-height:72px}
</style>
</head>
<body>
<header>
  <h1>Papeleo de apoyo escolar</h1>
  <p>Solo administración. No es consulta. No diagnostica. Usted firma.</p>
</header>
<div class="wrap" id="app"></div>
<script>
const ROLES={
  psi:{
    nom:"Psicólogo / psicóloga escolar",
    intro:"Solo formatos. Si un padre pide ‘¿qué tiene mi hijo?’, no use este botón: dé cita o canalice.",
    botones:[
      ["consentimiento","Consentimiento informado (plantilla)"],
      ["canalizacion","Nota de canalización a externo"],
      ["cita","Confirmación de cita con tutor"],
      ["inasistencia","Recado: el alumno no se presentó a sesión"],
      ["limites","Aviso de límites: esto no es terapia privada"],
      ["cte","Párrafo de 8 líneas para el CTE (sin expediente)"],
      ["protocolo","Lista: a quién avisar si hay riesgo"]
    ]
  },
  ts:{
    nom:"Trabajo social",
    intro:"Minutas, visitas y rutas. No decide el caso. No diagnostica.",
    botones:[
      ["visita","Guion de visita domiciliaria (administrativo)"],
      ["minuta","Minuta de entrevista con tutor"],
      ["ruta","Ruta: docente → TS → psicólogo → dirección"],
      ["carta","Carta formal a la familia (citatorio)"],
      ["becas","Lista de documentos para gestión de apoyo"],
      ["red","Directorio tipo: a qué instancia derivar (huecos)"],
      ["seguimiento","Bitácora de 5 líneas de un seguimiento"]
    ]
  }
};
const DETALLE={
  consentimiento:"Plantilla de consentimiento: quién atiende, para qué, confidencialidad y SUS límites (no es consultorio privado). Huecos para nombre y fecha. Sin diagnóstico.",
  canalizacion:"Nota de canalización: motivo en hechos observables, a qué servicio se pide, qué ya se hizo en escuela. Sin CIE-10 inventado.",
  cita:"Mensaje corto al tutor: día, hora, lugar, duración, quién atiende, qué llevar. Confirmar asistencia.",
  inasistencia:"Recado administrativo: el alumno no llegó a la hora acordada. Reagendar. Sin interpretaciones clínicas.",
  limites:"Circular de 120 palabras: el servicio escolar no sustituye tratamiento externo ni urgencias.",
  cte:"Texto genérico para CTE: temas de convivencia SIN nombres de alumnos.",
  protocolo:"Lista de casillas: docente, TS, psicólogo, dirección, tutor, autoridad si aplica. No describe métodos de daño.",
  visita:"Guion administrativo de visita: objetivo, quién autorizó, qué se observa del entorno escolarmente relevante, acuerdos. No es peritaje.",
  minuta:"Minuta: asistentes, motivo, 3 acuerdos, responsable, fecha de seguimiento.",
  ruta:"Diagrama en texto de escalamiento. Una página.",
  carta:"Citatorio formal: fecha, hora, asunto administrativo, qué pasa si no asisten.",
  becas:"Checklist de papeles típicos para gestión de apoyo (ingresos, CURP, comprobante). Huecos.",
  red:"Tabla vacía: DIF, fiscalía especializada, línea de la escuela, hospital de zona. El colegio llena teléfonos locales. No inventes números.",
  seguimiento:"5 líneas: fecha, hecho, acuerdo previo, qué sigue, próxima fecha."
};

let estado={rol:"ts",bot:"minuta"};

function home(){
  document.getElementById("app").innerHTML=`
  <div class="card">
    <p class="warn">Prohibido usar esto como consulta, chat con el menor o diagnóstico. Solo papeleo del adulto que ya tiene el caso.</p>
    <h2>¿Quién arma el documento?</h2>
    <div class="rol">
      <button class="chip" onclick="setRol('psi')">Psicólogo escolar</button>
      <button class="chip" onclick="setRol('ts')">Trabajo social</button>
    </div>
    <button class="line" onclick="location.href='asistente-direccion.html'">Ir a dirección / secretaría</button>
  </div>`;
}

function setRol(r){
  estado.rol=r;
  const R=ROLES[r];
  const b=R.botones.map(([id,n])=>`<button class="chip" onclick="estado.bot='${id}';setRol('${r}')">${n}</button>`).join("");
  document.getElementById("app").innerHTML=`
  <div class="card">
    <button class="line" onclick="home()">← Cambiar puesto</button>
    <h2>${R.nom}</h2>
    <p class="muted">${R.intro}</p>
    ${b}
    <textarea id="extra" rows="3" placeholder="Datos administrativos: nombres de adultos, fechas, grupo. NADA de expediente clínico."></textarea>
    <button class="btn" onclick="generar()">Armar plantilla</button>
  </div>
  <div id="out"></div>`;
}

function generar(){
  const extra=(document.getElementById("extra")||{}).value||"";
  const texto=`${ROLES[estado.rol].nom}
${DETALLE[estado.bot]}

${extra?"Datos del colegio:\\n"+extra+"\\n":""}
COLEGIO ________ · CICLO 2026-2027
Documento: ${DETALLE[estado.bot].split(".")[0]}

1. Encabezado y fecha
2. Para quién / de quién
3. Hechos observables (sin diagnóstico)
4. Acuerdo o siguiente paso administrativo
5. Quién firma y fecha de seguimiento

Este texto no es evaluación clínica ni tratamiento.
Si hay riesgo de un menor: protocolo del colegio y autoridad. No este formato.

Borrador. El profesional revisa y firma.`;
  document.getElementById("out").innerHTML=`
  <div class="card">
    <pre id="txt">${texto.replace(/</g,"")}</pre>
    <button class="gold" onclick="navigator.clipboard.writeText(document.getElementById('txt').innerText);alert('Copiado')">Copiar</button>
  </div>`;
}
home();
</script>
</body>
</html>
